spring.application.name=taskmentor

# Local secrets live in a gitignored .env file next to this module (see .env.example).
# In deployed environments the same keys come from real environment variables.
spring.config.import=optional:file:.env[.properties]

# Database Connection
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/TaskMentorSolo}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Properties
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# Flyway (src/main/resources/db/migration) owns the schema; Hibernate only checks that it matches the entities.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration (secret must be at least 32 bytes; generate with: openssl rand -base64 64)
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION_MS:86400000}

# Server Port
server.port=${PORT:8080}
